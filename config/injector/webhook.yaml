apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: dragonfly-injector
  annotations:
    cert-manager.io/inject-ca-from: dragonfly-system/dragonfly-injector-serving-cert
webhooks:
  - name: mpod-v1.d7y.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: dragonfly-injector-webhook
        namespace: dragonfly-system
        path: /mutate--v1-pod
        port: 443
    failurePolicy: Ignore
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "cert-manager", "dragonfly-system"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    sideEffects: None
