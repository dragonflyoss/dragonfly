apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dragonfly-injector-selfsigned
  namespace: dragonfly-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragonfly-injector-serving-cert
  namespace: dragonfly-system
spec:
  dnsNames:
    - dragonfly-injector-webhook.dragonfly-system.svc
    - dragonfly-injector-webhook.dragonfly-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: dragonfly-injector-selfsigned
  secretName: dragonfly-injector-webhook-cert
