apiVersion: v1
kind: ServiceAccount
metadata:
  name: dragonfly-injector
  namespace: dragonfly-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dragonfly-injector
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dragonfly-injector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dragonfly-injector
subjects:
  - kind: ServiceAccount
    name: dragonfly-injector
    namespace: dragonfly-system
