# Dynamic configuration for the scheduler running without a manager. It is
# loaded from this file instead of being fetched from the manager, and
# refreshed every dynConfig.refreshInterval defined in scheduler.yaml.

# Applications configuration.
applications: []

# Seed peer cluster configuration.
seedPeerClusterConfig:
  # loadLimit is the concurrent upload limit of the seed peer.
  loadLimit: 2000

# Scheduler cluster configuration.
schedulerClusterConfig:
  # candidateParentLimit is the limit of candidate parents.
  candidateParentLimit: 3
  # filterParentLimit is the limit of filter parents.
  filterParentLimit: 15

# Client configuration of the scheduler cluster.
schedulerClusterClientConfig:
  # loadLimit is the concurrent upload limit of the peer.
  loadLimit: 200
