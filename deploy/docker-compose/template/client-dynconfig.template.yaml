# Dynamic configuration for the client running without a manager. It is
# loaded from this file instead of being fetched from the manager, and
# refreshed every dynconfig.refreshInterval defined in dfdaemon.yaml.

scheduler:
  # addrs is the static list of scheduler addresses with port. When set, it
  # takes precedence over addr.
  addrs: ['__IP__:8002']
  # # addr is the address of the scheduler headless service with port, resolved
  # # via DNS to the list of scheduler IPs (e.g. in Kubernetes).
  # addr: 'scheduler-headless.default.svc:8002'
