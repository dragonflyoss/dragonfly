# Create the personal access token in the Dragonfly manager console (Personal Access
# Tokens, scope "job") and store it here. Replace the placeholder before applying.
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-manager-token
  namespace: dragonfly-system
type: Opaque
stringData:
  token: REPLACE_WITH_MANAGER_PERSONAL_ACCESS_TOKEN
