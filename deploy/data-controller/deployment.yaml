apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-datacontroller
  namespace: dragonfly-system
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/component: datacontroller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/component: datacontroller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dragonfly
        app.kubernetes.io/component: datacontroller
    spec:
      serviceAccountName: dragonfly-datacontroller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: datacontroller
          image: dragonflyoss/datacontroller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/dragonfly/datacontroller.yaml
          env:
            # Leader election leases are created in the pod namespace.
            - name: DATACONTROLLER_CONTROLLER_LEADERELECTIONNAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8000
            - name: health
              containerPort: 8001
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/dragonfly/datacontroller.yaml
              subPath: datacontroller.yaml
              readOnly: true
            - name: manager-token
              mountPath: /etc/dragonfly/manager
              readOnly: true
            - name: logs
              mountPath: /var/log/dragonfly
      volumes:
        - name: config
          configMap:
            name: dragonfly-datacontroller
        - name: manager-token
          secret:
            secretName: dragonfly-manager-token
        - name: logs
          emptyDir: {}
