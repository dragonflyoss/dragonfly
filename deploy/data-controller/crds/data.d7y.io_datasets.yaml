                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is a coarse summary of the state.
                type: string
              sources:
                description: Sources is the per-source state.
