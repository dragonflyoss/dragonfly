                      format: date-time
                      type: string
                    lastVerificationTime:
                      description: LastVerificationTime is when the source was last
                        verified.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human readable description of the
                        state.
                      type: string
                    name:
                      description: Name of the source.
                      type: string
                    nextRetryTime:
                      description: NextRetryTime is when the failed operation is retried.
                      format: date-time
                      type: string
                    operation:
                      description: Operation in flight, if any.
                      properties:
                        jobs:
                          description: Jobs created in the manager for the operation.
                          items:
