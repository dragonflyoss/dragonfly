                            properties:
                              id:
                                description: ID is the job ID in the manager.
                                type: integer
                              state:
                                description: State is the last observed job state.
                                type: string
                              type:
                                description: Type is the manager job type, for example
                                  preheat, get_task or delete_task.
                                type: string
                              url:
                                description: URL is the task URL the job targets,
                                  when it targets a single task.
                                type: string
                            required:
                            - id
                            - type
                            type: object
                          type: array
                        startedAt:
                          description: StartedAt is when the operation was started.
                          format: date-time
                          type: string
                        type:
                          description: Type of the operation.
                          type: string
                      required:
                      - startedAt
                      - type
                      type: object
                    reason:
                      description: Reason is a machine readable reason for the state.
                      type: string
                    retries:
                      description: Retries is the number of consecutive failed attempts
                        of the current operation type.
                      format: int32
                      type: integer
                    specHash:
                      description: SpecHash is the hash of the source and distribution
                        spec at the last distribution.
                      type: string
                    state:
                      description: State of the source.
                      type: string
                    tasks:
                      description: Tasks distributed for the source.
                      items:
                        description: TaskStatus is the observed state of one task
                          (a file URL or an image layer) of a source.
                        properties:
                          id:
                            description: ID is the task ID in the P2P network.
                            type: string
                          peerCount:
                            description: PeerCount is the number of peers holding
                              the task at the last verification.
                            format: int32
                            type: integer
                          url:
                            description: URL of the task.
                            type: string
                        required:
                        - url
                        type: object
                      type: array
