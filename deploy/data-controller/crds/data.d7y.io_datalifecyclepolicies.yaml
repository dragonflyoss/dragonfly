                    enum:
                    - Purge
                    - Retain
                    type: string
                  refreshInterval:
                    description: |-
                      RefreshInterval re-distributes the data periodically after the last successful distribution,
                      keeping it warm on the peers. Mutually exclusive with RefreshSchedule.
                    type: string
                  refreshSchedule:
                    description: RefreshSchedule re-distributes the data on a cron
                      schedule. Mutually exclusive with RefreshInterval.
                    type: string
                  ttl:
                    description: |-
                      TTL is how long the data is kept after its last successful distribution. When it elapses the
                      ExpireAction is applied and the dataset is marked expired.
                    type: string
                  verifyInterval:
                    description: VerifyInterval periodically checks which peers still
                      hold the data and reports it in the status.
                    type: string
                type: object
